---
# Write to every plausible doc root for globaltopbrands.eu.
# Whichever cPanel actually serves for the domain wins.
# Creates the dir if missing (SuperHosting sometimes provisions on first write).
deployment:
  tasks:
    - >-
      set -x;
      echo "== HOME: $HOME";
      ls -la "$HOME" || true;
      ls -la "$HOME/domains" 2>/dev/null || true;
      for D in \
          "$HOME/domains/globaltopbrands.eu/public_html" \
          "$HOME/public_html/globaltopbrands.eu" \
          "$HOME/public_html"; do
        echo "-- target: $D";
        mkdir -p "$D" 2>/dev/null || { echo "mkdir failed for $D"; continue; };
        cp -f index.html   "$D/" 2>&1 || echo "cp index.html failed";
        cp -f styles.css   "$D/" 2>&1 || echo "cp styles.css failed";
        cp -f script.js    "$D/" 2>&1 || echo "cp script.js failed";
        cp -f .htaccess    "$D/" 2>&1 || echo "cp .htaccess failed";
        cp -Rf media       "$D/" 2>&1 || echo "cp media failed";
        cp -Rf data        "$D/" 2>&1 || true;
        echo "-- wrote: $D";
        ls -la "$D";
      done;
      echo "== done"
