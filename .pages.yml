##
# Pages CMS configuration for globaltopbrands.eu
# Edit content in a browser at https://app.pagescms.org (connect this GitHub repo)
# Docs: https://pagescms.org/docs/configuration
##

media:
  input: media
  output: /media

content:

  # ---------- Site meta / SEO / brand / nav / footer ----------
  - name: site
    label: Site (SEO · Brand · Nav · Footer)
    type: file
    path: data/site.json
    format: json
    fields:
      - name: seo
        label: SEO
        type: object
        fields:
          - { name: title,       label: Page title,          type: string, required: true }
          - { name: description, label: Meta description,    type: text }
          - { name: keywords,    label: Meta keywords,       type: string }
          - { name: canonical,   label: Canonical URL,       type: string }
          - { name: og_image,    label: Social share image,  type: image }
      - name: brand
        label: Brand
        type: object
        fields:
          - { name: logo,       label: Header logo,      type: image }
          - { name: logo_alt,   label: Logo alt text,    type: string }
          - { name: cta_label,  label: Header CTA label, type: string }
          - { name: cta_href,   label: Header CTA link,  type: string }
      - name: nav
        label: Navigation links
        type: object
        list: true
        fields:
          - { name: label, label: Label, type: string, required: true }
          - { name: href,  label: Link,  type: string, required: true }
      - name: footer
        label: Footer
        type: object
        fields:
          - { name: copyright, label: "Copyright line (use {year} for current year)", type: string }

  # ---------- Hero section ----------
  - name: hero
    label: Hero section
    type: file
    path: data/hero.json
    format: json
    fields:
      - { name: eyebrow,             label: Eyebrow,              type: string }
      - { name: title_line1,         label: Headline — line 1,    type: string }
      - { name: title_line2,         label: Headline — line 2 (accent), type: string }
      - { name: subtitle,            label: Sub-headline,         type: text }
      - { name: cta_primary_label,   label: Primary CTA label,    type: string }
      - { name: cta_primary_href,    label: Primary CTA link,     type: string }
      - { name: cta_secondary_label, label: Secondary CTA label,  type: string }
      - { name: cta_secondary_href,  label: Secondary CTA link,   type: string }
      - { name: background_image,    label: Background image,     type: image }
      - name: stats
        label: Stats row (3 items recommended)
        type: object
        list: true
        fields:
          - { name: value, label: Value, type: string, required: true }
          - { name: label, label: Label, type: string, required: true }

  # ---------- Why Us ----------
  - name: why_us
    label: Why Us section
    type: file
    path: data/why-us.json
    format: json
    fields:
      - { name: eyebrow,  label: Eyebrow,  type: string }
      - { name: title,    label: Headline, type: string }
      - { name: subtitle, label: Subtitle, type: text }
      - name: cards
        label: Cards
        type: object
        list: true
        fields:
          - { name: title,       label: Title,       type: string, required: true }
          - { name: description, label: Description, type: text,   required: true }

  # ---------- Services ----------
  - name: services
    label: Services section
    type: file
    path: data/services.json
    format: json
    fields:
      - { name: eyebrow, label: Eyebrow,  type: string }
      - { name: title,   label: Headline, type: string }
      - name: items
        label: Services
        type: object
        list: true
        fields:
          - { name: number,      label: Step number, type: string }
          - { name: title,       label: Title,       type: string, required: true }
          - { name: description, label: Description, type: text,   required: true }

  # ---------- Supplier brands (marquee) ----------
  - name: suppliers
    label: Supplier brands (marquee)
    type: file
    path: data/suppliers.json
    format: json
    fields:
      - { name: eyebrow,  label: Eyebrow,  type: string }
      - { name: title,    label: Headline, type: string }
      - { name: subtitle, label: Subtitle, type: text }
      - name: brands
        label: Brand logos
        type: object
        list: true
        fields:
          - { name: name, label: Brand name, type: string, required: true }
          - { name: logo, label: Logo,       type: image }

  # ---------- Own Sites (stacked blocks) ----------
  - name: own_sites
    label: Own Sites section
    type: file
    path: data/own-sites.json
    format: json
    fields:
      - { name: eyebrow,  label: Eyebrow,  type: string }
      - { name: title,    label: Headline, type: string }
      - { name: subtitle, label: Subtitle, type: text }
      - name: sites
        label: Sites (stacked, in display order)
        type: object
        list: true
        fields:
          - { name: logo,         label: Site logo,      type: image }
          - { name: category,     label: Category label, type: string }
          - { name: name,         label: Site name,      type: string, required: true }
          - { name: tld,          label: TLD (.bg / .com), type: string }
          - { name: url,          label: Site URL,       type: string, required: true, pattern: "^https?://" }
          - { name: description,  label: Description,    type: text }
          - { name: cta_label,    label: CTA label,      type: string }
          - { name: brands_label, label: Brands strip label, type: string }
          - name: brands
            label: Featured brands (per site)
            type: object
            list: true
            fields:
              - { name: name, label: Brand name, type: string, required: true }
              - { name: logo, label: Logo,       type: image }

  # ---------- Telemarketing ----------
  - name: telemarketing
    label: Telemarketing section
    type: file
    path: data/telemarketing.json
    format: json
    fields:
      - { name: eyebrow, label: Eyebrow,        type: string }
      - { name: title,   label: Headline,       type: string }
      - { name: lead,    label: Lead paragraph, type: text }
      - name: bullets
        label: Bullet points (HTML allowed for <strong>)
        type: string
        list: true
      - { name: cta_label,       label: CTA label, type: string }
      - { name: cta_href,        label: CTA link,  type: string }
      - { name: image_main,      label: Main image,      type: image }
      - { name: image_main_alt,  label: Main image alt,  type: string }
      - { name: image_inset,     label: Inset image,     type: image }
      - { name: image_inset_alt, label: Inset image alt, type: string }

  # ---------- Contact ----------
  - name: contact
    label: Contact section
    type: file
    path: data/contact.json
    format: json
    fields:
      - { name: eyebrow,    label: Eyebrow,          type: string }
      - { name: title,      label: Headline,         type: string }
      - { name: subtitle,   label: Subtitle,         type: text }
      - { name: email,      label: Public email,     type: string, pattern: "^[^@]+@[^@]+\\.[^@]+$" }
      - { name: phone,      label: Public phone,     type: string }
      - { name: phone_href, label: "Phone tel: value", type: string }
      - { name: hours,      label: Hours,            type: string }
      - { name: send_to,    label: "Form recipient email", type: string, pattern: "^[^@]+@[^@]+\\.[^@]+$", description: "Address that receives inquiries submitted from the contact form." }
      - { name: form_success, label: Success message, type: string }
      - { name: form_error,   label: Error message,   type: string }
      - { name: form_button,  label: Submit button label, type: string }
